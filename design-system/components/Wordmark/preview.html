<!-- @dsCard group="Brand" height=320 subtitle="Inline and stacked lockups" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:var(--ground);}
  .stage{display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center;padding:var(--space-5);color:var(--text);}
  .mark{font-family:var(--font-display);font-weight:400;color:var(--text);margin:0;line-height:.95;}
  .mark svg{fill:var(--star);display:inline-block;}
  .inline{font-size:56px;display:flex;align-items:center;gap:.18em;white-space:nowrap;}
  .inline svg{width:.5em;height:.5em;}
  .stacked{font-size:88px;display:grid;}
  .stacked .row{display:flex;align-items:flex-start;gap:.08em;}
  .stacked svg{width:.36em;height:.36em;margin-top:.1em;}
  .label{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0 0 var(--space-2);}
</style></head>
<body>
<div class="stage">
  <div><p class="label">Inline</p><p class="mark inline">Elton<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg>John</p></div>
  <div><p class="label">Stacked</p><p class="mark stacked"><span class="row">Elton<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg></span><span>John</span></p></div>
</div>
</body></html>
