<!-- @dsCard height=320 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:var(--ground);}
  .cover{position:relative;width:960px;height:320px;overflow:hidden;background:var(--ground);}
  svg{position:absolute;inset:0;}
  .pistachio{fill:var(--stripe);} .deep{fill:var(--ground-deep);} .cream{fill:var(--stock);} .gold{fill:var(--star);} .pink{fill:var(--spark);}
  .text{position:absolute;left:var(--space-5);bottom:var(--space-5);max-width:440px;}
  h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:64px;line-height:.95;color:var(--text);white-space:nowrap;}
  p{margin:var(--space-3) 0 0;font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--text-second);}
</style></head>
<body>
<div class="cover">
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
    <!--
      blocks: stock 288x176 ticket (notch 12 corners), ground-deep 96x176 (space-6 wide), star 96x96 (space-6), spark 96x80; on the ground.
      arrangement: a strip of unequal blocks under a full-width band, bleeding off the bottom and right, like a ticket under an awning.
      pattern: the satin band, stripe-colour stripes at stripe-width 36 / stripe-gap 12 with a scallop edge at 24 pitch; it is this system's own frame, from the suit's satin.
      scales: space-5 48 gap under the band, space-6 96 block sides, notch 12, radius-none elsewhere.
    -->
    <g>
      <rect class="pistachio" x="480" y="0" width="36" height="96"/>
      <rect class="pistachio" x="528" y="0" width="36" height="96"/>
      <rect class="pistachio" x="576" y="0" width="36" height="96"/>
      <rect class="pistachio" x="624" y="0" width="36" height="96"/>
      <rect class="pistachio" x="672" y="0" width="36" height="96"/>
      <rect class="pistachio" x="720" y="0" width="36" height="96"/>
      <rect class="pistachio" x="768" y="0" width="36" height="96"/>
      <rect class="pistachio" x="816" y="0" width="36" height="96"/>
      <rect class="pistachio" x="864" y="0" width="36" height="96"/>
      <rect class="pistachio" x="912" y="0" width="36" height="96"/>
      <circle class="pistachio" cx="492" cy="96" r="11"/>
      <circle class="pistachio" cx="516" cy="96" r="11"/>
      <circle class="pistachio" cx="540" cy="96" r="11"/>
      <circle class="pistachio" cx="564" cy="96" r="11"/>
      <circle class="pistachio" cx="588" cy="96" r="11"/>
      <circle class="pistachio" cx="612" cy="96" r="11"/>
      <circle class="pistachio" cx="636" cy="96" r="11"/>
      <circle class="pistachio" cx="660" cy="96" r="11"/>
      <circle class="pistachio" cx="684" cy="96" r="11"/>
      <circle class="pistachio" cx="708" cy="96" r="11"/>
      <circle class="pistachio" cx="732" cy="96" r="11"/>
      <circle class="pistachio" cx="756" cy="96" r="11"/>
      <circle class="pistachio" cx="780" cy="96" r="11"/>
      <circle class="pistachio" cx="804" cy="96" r="11"/>
      <circle class="pistachio" cx="828" cy="96" r="11"/>
      <circle class="pistachio" cx="852" cy="96" r="11"/>
      <circle class="pistachio" cx="876" cy="96" r="11"/>
      <circle class="pistachio" cx="900" cy="96" r="11"/>
      <circle class="pistachio" cx="924" cy="96" r="11"/>
      <circle class="pistachio" cx="948" cy="96" r="11"/>
    </g>
    <rect class="deep" x="480" y="144" width="96" height="176"/>
    <polygon class="cream" points="588,144 852,144 864,156 864,320 576,320 576,156"/>
    <rect class="gold" x="864" y="144" width="96" height="96"/>
    <rect class="pink" x="864" y="240" width="96" height="80"/>
  </svg>
  <div class="text">
    <h1>Elton John<br>Mexico City</h1>
    <p>Bottle-green satin, gold-foil stars, one flash of pink.</p>
  </div>
</div>
</body></html>
