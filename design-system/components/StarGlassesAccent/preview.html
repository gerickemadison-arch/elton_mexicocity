<!-- @dsCard group="Stationery" height=420 subtitle="A pink side panel inside a Lapel piece, and a pink drink ticket" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:var(--ground);}
  .stage{display:flex;flex-wrap:wrap;gap:var(--space-4);padding:var(--space-4);align-items:flex-start;}
  .piece{display:grid;grid-template-columns:2fr 1fr;max-width:640px;width:100%;}
  .main,.side{background:var(--ground);color:var(--text);position:relative;overflow:hidden;}
  .band{height:56px;position:relative;background:repeating-linear-gradient(90deg,var(--stripe) 0 var(--stripe-width),var(--ground) var(--stripe-width) calc(var(--stripe-width) + var(--stripe-gap)));}
  .band::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 12px 0,var(--stripe) 11px,transparent 12px) 0 0/var(--scallop) 12px repeat-x;}
  .inner{padding:var(--space-5) var(--space-4) var(--space-4);display:grid;gap:var(--space-1);}
  .eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--label);font-variant-numeric:lining-nums;white-space:nowrap;}
  h2,h3{margin:0;font-family:var(--font-display);font-weight:400;line-height:1;}
  h2{font-size:40px;} h3{font-size:32px;}
  .stop{display:grid;grid-template-columns:96px 1fr;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--seam);align-items:baseline;}
  .stop:first-of-type{margin-top:var(--space-3);}
  .name{display:block;font-family:var(--font-accent);font-style:italic;font-weight:500;font-size:21px;line-height:1.25;}
  .detail{display:block;font-family:var(--font-sans);font-size:14px;color:var(--text-second);}
  .aside{margin:var(--space-2) 0 0;font-family:var(--font-accent);font-style:italic;font-weight:500;font-size:22px;line-height:1.2;color:var(--spark);}
  .side .inner{gap:var(--space-2);}
  .side p:not(.aside){margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--text-second);}
  .stars{display:flex;gap:6px;margin-top:var(--space-3);}
  .stars svg{width:14px;height:14px;fill:var(--star);}
  .chit{background:var(--ground);padding:var(--space-4);display:grid;place-items:center;}
  .ticket{background:var(--stock);color:var(--stock-ink);text-align:center;display:grid;gap:var(--space-1);padding:var(--space-3) var(--space-4);
    clip-path:polygon(var(--notch) 0,calc(100% - var(--notch)) 0,100% var(--notch),100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,var(--notch) 100%,0 calc(100% - var(--notch)),0 var(--notch));}
  .ticket .eyebrow{color:var(--stock-ink);}
  .ticket .t{font-family:var(--font-accent);font-style:italic;font-weight:500;font-size:24px;}
  .ticket .fine{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border-top:1px dashed var(--stock-ink);padding-top:var(--space-2);margin-top:var(--space-1);}
  @media (max-width:560px){.piece{grid-template-columns:1fr;}}
</style></head>
<body>
<div class="stage">
  <div class="piece">
    <div class="main">
      <div class="band"></div>
      <div class="inner">
        <span class="eyebrow">Sábado 18 de febrero</span>
        <h2>La noche</h2>
        <div class="stop"><span class="eyebrow">6 PM</span><span><span class="name">Cocktails</span><span class="detail">Hotel terrace</span></span></div>
        <div class="stop"><span class="eyebrow">8 PM</span><span><span class="name">Elton John</span><span class="detail">Palacio de los Deportes</span></span></div>
      </div>
    </div>
    <div class="side" data-theme="star-glasses">
      <div class="band"></div>
      <div class="inner">
        <span class="eyebrow">11 PM</span>
        <h3>Rocket Man</h3>
        <p class="aside">the after-party</p>
        <p>Sunglasses on. Bar opens when the encore ends.</p>
        <div class="stars" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg><svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg><svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg><svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg><svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg></div>
      </div>
    </div>
  </div>
  <div class="chit" data-theme="star-glasses">
    <div class="ticket"><span class="eyebrow">After-party</span><span class="t">Rocket Man</span><span class="fine">Una copa · Nº 1975</span></div>
  </div>
</div>
</body></html>
